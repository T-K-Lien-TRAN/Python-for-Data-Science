[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ft_package"
version = "0.0.1"
description = "A sample test package"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lien", email = "lientranthikim@yahoo.com"}
]

[project.urls]
Homepage = "https://github.com/T-K-Lien-TRAN/Python-for-Data-Science/tree/main/Python-0-Starting/ex09/ft_package"

[tool.setuptools.packages.find]
where = ["."]
include = ["ft_package*"]